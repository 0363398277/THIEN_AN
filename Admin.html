<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý</title>
    <!-- Thư viện Quill Editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #eef2f5; display: flex; justify-content: center; padding: 20px 10px; margin: 0; }
        
        /* KHUNG CHÍNH RỘNG RÃI */
        .main-container { background: #ffffff; padding: 25px 30px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 100%; max-width: 1100px; }
        
		body { background-color: #eef2f5; display: flex; justify-content: center; padding: 20px 10px; margin: 0; min-height: 100vh; align-items: center; }

/* KHUNG ĐĂNG NHẬP */
#loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 99999; }
.login-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
.login-card h2 { margin-bottom: 20px; color: #2c3e50; }
.login-card input { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 6px; font-size: 16px; margin-bottom: 15px; text-align: center; }
.login-card button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
.login-card button:hover { background-color: #219150; }
#loginMsg { margin-top: 10px; font-size: 14px; font-weight: bold; }
		
        /* THANH TAB TÁC VỤ */
        .tab-menu { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 25px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tab-btn { padding: 12px 20px; border: none; background: none; font-size: 16px; font-weight: bold; color: #7f8c8d; cursor: pointer; transition: 0.3s; border-bottom: 3px solid transparent; flex-shrink: 0; }
        .tab-btn.active { color: #27ae60; border-bottom: 3px solid #27ae60; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* FORM CHUNG */
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; font-size: 15px; }
        input[type="text"], input[type="number"], input[type="url"], input[type="date"] { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }

        .input-with-btn { position: relative; display: flex; align-items: center; }
        .input-with-btn input { padding-right: 50px; }
        .btn-inside-input { position: absolute; right: 5px; background: #eef2f5; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 18px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-inside-input:hover { background: #27ae60; color: white; border-color: #27ae60; }

        .image-preview-box { margin-top: 10px; width: 100%; min-height: 180px; border: 2px dashed #3498db; border-radius: 6px; background-color: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
        .image-preview-box img { max-width: 100%; max-height: 220px; object-fit: contain; display: none; }
        .image-preview-box span { color: #7f8c8d; font-size: 14px; font-style: italic; text-align: center; }

        #editor-container { height: 180px; background-color: #fff; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; font-size: 15px; }
        .ql-toolbar { border-top-left-radius: 6px; border-top-right-radius: 6px; background-color: #f8f9fa; }
        
        .btn-submit { width: 100%; padding: 14px; background-color: #27ae60; color: #ffffff; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background-color: #219150; }
        #msg { margin-top: 15px; text-align: center; font-weight: bold; padding: 12px; border-radius: 6px; font-size: 15px; }

        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; }
        .btn-search { padding: 12px 22px; background-color: #2980b9; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; flex-shrink: 0; font-size: 15px; }
        .btn-search:hover { background-color: #3498db; }

        /* BỘ LỌC TAB BÁN HÀNG */
        .filter-container { display: flex; gap: 15px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; align-items: flex-end; flex-wrap: wrap; }
        .filter-item { flex: 1; min-width: 200px; }
        .filter-item label { font-size: 13px; margin-bottom: 5px; color: #475569; }

        /* BẢNG DỮ LIỆU BÁN HÀNG HIỆN ĐẠI & CỐ ĐỊNH TIÊU ĐỀ */
        .table-responsive { width: 100%; max-height: 500px; overflow-y: auto; overflow-x: auto; margin-top: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
        table.sales-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; font-size: 14px; background: #fff; }
        table.sales-table th, table.sales-table td { padding: 14px 16px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; }
        table.sales-table th { background-color: #0061ff; color: #ffffff; font-weight: 600; position: sticky; top: 0; z-index: 10; box-shadow: inset 0 -2px 0 #0f172a; }
        table.sales-table tbody tr:nth-child(even) { background-color: #f8fafc; }
        table.sales-table tfoot td { font-weight: bold; background-color: #ff3333; color: #ffffff; border-top: 2px solid #94a3b8; position: sticky; bottom: 0; z-index: 5; }

        /* LƯỚI SẢN PHẨM PHÓNG TO */
        .product-card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        @media (max-width: 480px) {
            .product-card-list { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }

        .product-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.06); text-align: center; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); border-color: #27ae60; }
        
        .card-img-wrapper { width: 100%; height: 160px; background: #f8fafc; border-radius: 6px; border: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 8px; }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: contain; }

        .product-card .code { font-size: 12px; background: #eef2f5; padding: 2px 8px; border-radius: 4px; color: #555; display: inline-block; margin-bottom: 3px; font-weight: 600; }
        .product-card .title { font-weight: bold; color: #2c3e50; font-size: 15px; margin: 2px 0 4px 0; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .product-card .price { color: #e74c3c; font-weight: bold; font-size: 16px; margin: 2px 0; }
        .product-card .score { color: #f39c12; font-size: 13px; margin-top: 2px; }
        
        .btn-view-detail { margin-top: 10px; padding: 8px; background-color: #f8f9fa; border: 1px solid #dcdde1; border-radius: 5px; font-size: 13px; font-weight: 600; color: #2c3e50; transition: 0.2s; }
        .product-card:hover .btn-view-detail { background-color: #27ae60; color: #fff; border-color: #27ae60; }

        .btn-submit-emp { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 17px; margin-top: 20px; }
        .btn-submit-emp:hover { background-color: #218838; }
        
        #empStatus { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-weight: bold; text-align: center; font-size: 15px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .warning { background-color: #fff3cd; color: #856404; }

        /* POPUP MODAL PHÓNG TO ẢNH */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 9999; padding: 15px; }
        .modal-card { background: #fff; border-radius: 12px; max-width: 750px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 25px; position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.25); animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-close { position: absolute; top: 12px; right: 15px; font-size: 28px; font-weight: bold; color: #7f8c8d; cursor: pointer; border: none; background: none; }
        .modal-close:hover { color: #e74c3c; }
        
        .modal-header { display: flex; gap: 25px; border-bottom: 1px solid #eee; padding-bottom: 18px; margin-bottom: 18px; align-items: center; }
        
        .modal-img-box { width: 280px; height: 280px; border: 1px solid #e0e0e0; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #fafafa; padding: 8px; }
        .modal-img-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .modal-info { flex: 1; }
        .modal-info h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 20px; line-height: 1.3; }
        .modal-info p { margin: 8px 0; font-size: 15px; color: #444; }
        .modal-body-title { font-weight: bold; color: #2c3e50; margin-bottom: 10px; font-size: 16px; border-bottom: 2px solid #27ae60; display: inline-block; padding-bottom: 3px; }
        
        .modal-details-content { font-size: 15px; color: #333; line-height: 1.4; word-break: break-word; background: #fdfdfd; padding: 15px; border: 1px solid #f0f0f0; border-radius: 6px; }
        .modal-details-content p, 
        .modal-details-content div, 
        .modal-details-content ul, 
        .modal-details-content ol { margin-top: 3px; margin-bottom: 5px; }
        .modal-details-content ul, 
        .modal-details-content ol { padding-left: 20px; }

        @media (max-width: 650px) {
            .modal-header { flex-direction: column; text-align: center; }
            .modal-img-box { width: 100%; height: 260px; }
            .modal-info h3 { font-size: 18px; }
        }
		
/* Căn giữa tất cả các tiêu đề (th) trên thanh tiêu đề của bảng */
table.sales-table th {
    text-align: center !important;
}

/* Tự động co giãn vừa khít nội dung cho 4 cột tổng/số liệu cuối cùng bên phải */
table.sales-table th:nth-last-child(-n+4),
table.sales-table td:nth-last-child(-n+4) {
    width: 1%;
    white-space: nowrap;
}
    </style>
</head>
<body>


<!-- KHUNG ĐĂNG NHẬP BAN ĐẦU -->
<div id="loginOverlay">
    <div class="login-card">
        <h2>Đăng Nhập Hệ Thống</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="password" id="loginPassword" required placeholder="Nhập mật khẩu truy cập...">
            <button type="submit" id="btnLogin">Xác Nhận</button>
        </form>
        <div id="loginMsg"></div>
    </div>
</div>

<!-- THÊM id="mainContainer" và style="display: none;" ĐỂ ẨN KHI CHƯA ĐĂNG NHẬP -->
<div class="main-container" id="mainContainer" style="display: none;">
    <!-- THANH MENU TAB -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('tabAddProduct', this)">Thêm Sản Phẩm</button>
        <button class="tab-btn" onclick="switchTab('tabViewProduct', this)">Xem Sản Phẩm</button>
        <button class="tab-btn" onclick="switchTab('tabEmployee', this)">Đăng Ký Nhân Viên</button>
        <button class="tab-btn" onclick="switchTab('tabSales', this)">Bán Hàng</button>
    </div>

    <!-- TAB 1: THÊM SẢN PHẨM -->
    <div id="tabAddProduct" class="tab-content active">
        <form id="productForm">
            <div class="form-group">
                <label for="maSP">Mã SP</label>
                <input type="text" id="maSP" required placeholder="Nhập Mã SP (Ví dụ: 0001)">
            </div>
            <div class="form-group">
                <label for="tenSP">Tên SP</label>
                <input type="text" id="tenSP" required placeholder="Nhập Tên sản phẩm">
            </div>
            <div class="form-group">
                <label for="giaSP">Giá SP (đ)</label>
                <input type="text" id="giaSP" required placeholder="Nhập Giá sản phẩm (Ví dụ: 1000000)">
            </div>
			
			<div class="form-group">
				<label for="soLuong">Số Lượng</label>
				<input type="number" id="soLuong" required placeholder="Nhập số lượng sản phẩm kho">
			</div>

            <div class="form-group">
                <label for="diem">Điểm</label>
                <input type="number" id="diem" required placeholder="Nhập Điểm tích lũy / đánh giá">
            </div>
            <div class="form-group">
                <label for="anh">Link Ảnh Sản Phẩm (URL)</label>
                <input type="url" id="anh" required placeholder="https://link-anh.com/hinh-anh.jpg">
                <div class="image-preview-box">
                    <span id="previewText">Khung xem trước ảnh sẽ hiển thị tại đây</span>
                    <img id="imgPreview" src="" alt="Xem trước ảnh">
                </div>
            </div>
            <div class="form-group">
                <label>Thông tin chi tiết</label>
                <div id="editor-container"></div>
            </div>
            <button type="submit" id="btnSave" class="btn-submit">Lưu Sản Phẩm</button>
        </form>
        <div id="msg"></div>
    </div>

    <!-- TAB 2: XEM SẢN PHẨM -->
    <div id="tabViewProduct" class="tab-content">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Nhập Mã SP hoặc Tên SP để tìm kiếm...">
            <button class="btn-search" onclick="loadProducts()">Xem Sản Phẩm</button>
        </div>
        <div id="viewStatus" style="text-align: center; font-weight: bold; margin-bottom: 12px; font-size: 14px;"></div>
        <div class="product-card-list" id="productList"></div>
    </div>

    <!-- TAB 3: ĐĂNG KÝ NHÂN VIÊN -->
    <div id="tabEmployee" class="tab-content">
        <div class="form-group">
            <label for="maNV">Mã Nhân Viên:</label>
            <div class="input-with-btn">
                <input type="text" id="maNV" placeholder="Tự nhập hoặc bấm 🔁 để tạo tự động">
                <button type="button" class="btn-inside-input" onclick="generateCode()" title="Tạo mã tự động">🔁</button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="tenNV">Tên Nhân Viên:</label>
            <input type="text" id="tenNV" placeholder="Nhập họ và tên">
        </div>
        
        <div class="form-group">
            <label for="ngaySinh">Ngày Sinh (dd/mm/yyyy):</label>
            <input type="text" id="ngaySinh" placeholder="dd/mm/yyyy" maxlength="10">
        </div>
        
        <div class="form-group">
            <label for="cccd">Số CCCD:</label>
            <input type="text" id="cccd" placeholder="Nhập số CCCD">
        </div>

        <div class="form-group">
            <label for="sdt">Số Điện Thoại:</label>
            <input type="text" id="sdt" placeholder="Nhập số điện thoại">
        </div>

        <button type="button" class="btn-submit-emp" onclick="submitEmployeeForm(false)">Lưu Thông Tin Nhân Viên</button>

        <div id="empStatus"></div>
    </div>

    <!-- TAB 4: BÁN HÀNG (BAN_HANG) -->
    <div id="tabSales" class="tab-content">
        <div class="filter-container" style="display: flex; gap: 15px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; align-items: flex-end; flex-wrap: wrap;">
            <div class="filter-item">
                <label for="filterDate">Lọc theo Ngày (dd/mm/yyyy):</label>
                <input type="date" id="filterDate">
            </div>
            <div class="filter-item">
                <label for="filterEmpCode">Lọc theo Mã Nhân Viên:</label>
                <input type="text" id="filterEmpCode" placeholder="Nhập mã nhân viên...">
            </div>
            <!-- BỔ SUNG Ô LỌC MÃ SẢN PHẨM -->
            <div class="filter-item">
                <label for="filterProductCode">Lọc theo Mã Sản Phẩm:</label>
                <input type="text" id="filterProductCode" placeholder="Nhập mã sản phẩm...">
            </div>
            <div style="display: flex; gap: 10px;">
				<button class="btn-search" onclick="applyClientFilter()" style="margin: 0;">Lọc Dữ Liệu</button>
                <button class="btn-search" onclick="fetchAndCacheSalesData()" style="background-color: #27ae60; margin: 0;">Cập Nhật Dữ Liệu</button>
                
            </div>
        </div>

        <div id="salesStatus" style="text-align: center; font-weight: bold; margin-bottom: 12px; font-size: 14px;"></div>
        
       <div class="table-responsive">
            <table class="sales-table">
                <thead>
                    <tr>
                        <th>Ngày</th>
                        <th>Mã NV</th>
                        <th>Mã SP</th>
                        <th>Tên SP</th>
                        <th>Đơn Giá</th>
                        <th>Số Lượng</th>
                        <th>Thành Tiền</th>
                        <th>Tiền Mặt</th>
                        <th>Chuyển Khoản</th>
                        <th>Điểm Thưởng</th>
                    </tr>
                </thead>
                <tbody id="salesTableBody">
                    <tr>
                        <td colspan="10" style="text-align: center; color: #7f8c8d;">Chưa có dữ liệu. Vui lòng bấm "Cập Nhật Dữ Liệu" để bắt đầu.</td>
                    </tr>
                </tbody>
                <tfoot id="salesTableFoot" style="display: none;">
                    <tr>
                        <td colspan="6" style="text-align: center; font-weight: bold;">TỔNG CỘNG:</td>
                        <td id="sumThanhTien" style="text-align: right;">0</td>
                        <td id="sumTienMat" style="text-align: right;">0</td>
                        <td id="sumChuyenKhoan" style="text-align: right;">0</td>
                        <td id="sumDiemThuong" style="text-align: right;">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

<!-- POPUP XEM CHI TIẾT SẢN PHẨM -->
<div class="modal-overlay" id="productModal" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModalDirect()">&times;</button>
        <div class="modal-header">
            <div class="modal-img-box">
                <img id="modalImg" src="" alt="Ảnh sản phẩm">
            </div>
            <div class="modal-info">
                <span class="code" id="modalCode" style="font-size:12px; background:#eef2f5; padding:3px 8px; border-radius:4px;"></span>
                <h3 id="modalTitle"></h3>
                <p><strong>Giá bán:</strong> <span id="modalPrice" style="color:#e74c3c; font-weight:bold; font-size:18px;"></span></p>
                <p> <span id="modalScore" style="color:#f39c12; font-size:16px;"></span></p>
            </div>
        </div>
        <div class="modal-body-title">Mô Tả Chi Tiết</div>
        <div class="modal-details-content" id="modalDetails"></div>
    </div>
</div>

<!-- Thư viện Quill Editor JS -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw1Afv0CoAMoK-JVjj5H6XJ-40eoA4jgOOneAIHCdHD90Wx_1eTp9hHjqwbTfaqL35i/exec';
    const fallbackSVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 150 150'><rect width='100%' height='100%' fill='%23f8fafc'/><path d='M60 55 L90 55 L90 95 L60 95 Z' fill='none' stroke='%23cbd5e1' stroke-width='2'/><circle cx='68' cy='65' r='4' fill='%23cbd5e1'/><path d='M60 85 L72 73 L80 81 L85 76 L90 85 Z' fill='%23cbd5e1'/><text x='50%' y='80%' font-family='sans-serif' font-size='11' fill='%2394a3b8' text-anchor='middle'>Anh loi / Khong co anh</text></svg>";

    let cachedProducts = [];
	
// HÀM XỬ LÝ ĐĂNG NHẬP
    function handleLogin(e) {
        e.preventDefault();
        const password = document.getElementById('loginPassword').value.trim();
        const btnLogin = document.getElementById('btnLogin');
        const loginMsg = document.getElementById('loginMsg');

        btnLogin.disabled = true;
        btnLogin.innerText = 'Đang kiểm tra...';
        loginMsg.style.color = '#2980b9';
        loginMsg.innerText = 'Đang xác thực mật khẩu...';

        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'verifyPassword', password: password })
        })
        .then(res => res.json())
        .then(res => {
            if (res.result === 'success') {
                // Ẩn bảng đăng nhập, hiện giao diện chính
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
            } else {
                loginMsg.style.color = '#c0392b';
                loginMsg.innerText = '❌ ' + (res.message || 'Mật khẩu không chính xác!');
            }
        })
        .catch(err => {
            loginMsg.style.color = '#c0392b';
            loginMsg.innerText = '❌ Lỗi kết nối đến máy chủ!';
        })
        .finally(() => {
            btnLogin.disabled = false;
            btnLogin.innerText = 'Xác Nhận';
        });
    }

        msg.style.backgroundColor = '#e3f2fd';

        let inputMaSP = document.getElementById('maSP').value.trim();

        const payload = {
            action: 'add',
            maSP: inputMaSP,
            tenSP: document.getElementById('tenSP').value,
            giaSP: rawGiaSP,
            soLuong: document.getElementById('soLuong').value, // <--- Bổ sung dòng này để gửi số lượng lên server
            diem: document.getElementById('diem').value,
            anh: inputAnh.value,

            allowOverwrite: allowOverwrite,
            allowDuplicateName: allowDuplicateName
        };

        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            if (res.result === 'duplicate_code') {
                btnSave.disabled = false;
                btnSave.innerText = 'Lưu Sản Phẩm';
                if (confirm(res.message + "\n\nBạn có muốn THAY THẾ (ghi đè) thông tin sản phẩm này không?")) {
                    sendProductData(true, allowDuplicateName);

                }
            } else if (res.result === 'duplicate_name') {
                btnSave.disabled = false;
                btnSave.innerText = 'Lưu Sản Phẩm';
                if (confirm(res.message + "\n\nBạn có chắc chắn vẫn muốn THÊM sản phẩm trùng tên này không?")) {
                    sendProductData(allowOverwrite, true);
                } else {

                msg.style.color = '#155724';
                msg.innerText = '✅ ' + res.message;
                document.getElementById('productForm').reset();

                msg.style.backgroundColor = '#f8d7da';
                msg.style.color = '#721c24';
                msg.innerText = '❌ Lỗi: ' + res.message;

            msg.style.color = '#721c24';
            msg.innerText = '❌ Có lỗi kết nối!';

            btnSave.innerText = 'Lưu Sản Phẩm';

    // Hàm hỗ trợ chuẩn hóa mọi định dạng ngày sang dd/mm/yyyy
    function normalizeDate(dateStr) {
        if (!dateStr) return "";
        dateStr = dateStr.toString().trim();

        // Thử parse bằng đối tượng Date của Javascript (xử lý kiểu "Thu Sep 24 2026...")
        let d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
            let day = String(d.getDate()).padStart(2, '0');
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Xử lý nếu chuỗi có dạng "24/09/2026 21:06:16" hoặc tương tự
        let parts = dateStr.split(/[\/\s:]/);
        if (parts.length >= 3 && parts[2].length === 4) {
            return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
        }

        return dateStr; // Trả về nguyên bản nếu không khớp dạng nào
    }

    // 1. Hàm gọi API tải toàn bộ dữ liệu về lưu vào biến tạm (Cache) và tự động chuẩn hóa ngày

                cachedSalesData = (res.data || []).map(item => {

    // 2. Hàm lọc dữ liệu ngay trên mảng cachedSalesData ở máy người dùng
    function applyClientFilter() {
        if (cachedSalesData.length === 0) {
            alert('Chưa có dữ liệu trong bộ nhớ máy. Vui lòng bấm "Cập Nhật Dữ Liệu" trước!');
            return;
        }

        const filterDateVal = document.getElementById('filterDate').value; // Định dạng từ input date: YYYY-MM-DD
        const filterEmpCode = document.getElementById('filterEmpCode').value.trim().toUpperCase();
        const filterProductCode = document.getElementById('filterProductCode').value.trim().toUpperCase(); // Lấy giá trị mã sản phẩm
        
        let filtered = cachedSalesData.filter(item => {
            let matchDate = true;
            let matchEmp = true;
            let matchProduct = true;

            // Chuyển YYYY-MM-DD từ ô input thành DD/MM/YYYY để so khớp
            if (filterDateVal) {
                const parts = filterDateVal.split('-'); // [YYYY, MM, DD]
                const formattedInputDate = `${parts[2]}/${parts[1]}/${parts[0]}`; // DD/MM/YYYY
                
                if (item.ngay !== formattedInputDate) {
                    matchDate = false;
                }
            }

            // Xử lý lọc theo mã nhân viên
            if (filterEmpCode) {
                if (!String(item.maNV || '').toUpperCase().includes(filterEmpCode)) {
                    matchEmp = false;
                }
            }

            // Xử lý lọc theo mã sản phẩm
            if (filterProductCode) {
                if (!String(item.MaSP || '').toUpperCase().includes(filterProductCode)) {
                    matchProduct = false;
                }
            }

            return matchDate && matchEmp && matchProduct;
        });

        renderSalesTable(filtered);
        
        const salesStatus = document.getElementById('salesStatus');
        salesStatus.style.color = '#2980b9';
        salesStatus.innerText = `Lọc thành công: Hiển thị ${filtered.length} / ${cachedSalesData.length} bản ghi.`;
    }

        document.getElementById('sumTienMat').innerText = sumTienMat.toLocaleString('vi-VN') + ' đ';
        document.getElementById('sumChuyenKhoan').innerText = sumChuyenKhoan.toLocaleString('vi-VN') + ' đ';
        document.getElementById('sumDiemThuong').innerText = sumDiemThuong.toLocaleString('vi-VN');
        salesTableFoot.style.display = 'table-row-group';
    }
// TÍNH NĂNG KÉO GIÃN KÍCH THƯỚC CÁC CỘT BẢNG
        document.addEventListener('DOMContentLoaded', function () {
            const table = document.querySelector('.sales-table');
            if (!table) return;
            const cols = table.querySelectorAll('th');
            cols.forEach(function (col) {
                const resizer = document.createElement('div');
                resizer.style.width = '5px';
                resizer.style.height = '100%';
                resizer.style.position = 'absolute';
                resizer.style.right = '0';
                resizer.style.top = '0';
                resizer.style.cursor = 'col-resize';
                resizer.style.userSelect = 'none';
                col.style.position = 'relative';
                col.appendChild(resizer);

                let x = 0, w = 0;
                resizer.addEventListener('mousedown', function (e) {
                    x = e.clientX;
                    w = col.offsetWidth;
                    document.addEventListener('mousemove', mouseMoveHandler);
                    document.addEventListener('mouseup', mouseUpHandler);
                });

                function mouseMoveHandler(e) {
                    const dx = e.clientX - x;
                    col.style.width = `${w + dx}px`;
                }

                function mouseUpHandler() {
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                }
            });
        });
		
// Kiểm tra sự kiện bấm nút đăng nhập hoặc ấn Enter
document.getElementById('adminPassword').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        checkAdminPassword();
    }
});

function checkAdminPassword() {
    const password = document.getElementById('adminPassword').value.trim();
    const loginMsg = document.getElementById('loginMsg');
    
    if (!password) {
        loginMsg.style.color = '#c0392b';
        loginMsg.innerText = 'Vui lòng nhập mật khẩu!';
        return;
    }

    loginMsg.style.color = '#2980b9';
    loginMsg.innerText = 'Đang xác thực...';

    fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'verifyPassword', password: password })
    })
    .then(res => res.json())
    .then(res => {
        if (res.result === 'success') {
            // Đăng nhập thành công -> ẩn bảng đăng nhập đi
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            loginMsg.style.color = '#c0392b';
            loginMsg.innerText = res.message || 'Mật khẩu không chính xác!';
        }
    })
    .catch(err => {
        loginMsg.style.color = '#c0392b';
        loginMsg.innerText = 'Lỗi kết nối đến server!';
    });
}
